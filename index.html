<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050914" />
    <meta name="description" content="全屏 Canvas 实时计算并绘制 Mandelbrot 集。" />
    <title>Mandelbrot 集</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="mandelbrot" role="img" aria-label="Mandelbrot 集。滚轮缩放，拖拽平移，触屏双指缩放，按 Home 恢复全貌。">您的浏览器不支持 Canvas。</canvas>
    <header class="site-heading">
      <h1>Mandelbrot Set<a class="reference-link" href="https://en.wikipedia.org/wiki/Mandelbrot_set" target="_blank" rel="noopener noreferrer" aria-label="在新窗口打开 Mandelbrot Set 维基百科条目">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M6 3.5H3.5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V10" /></svg>
      </a></h1>
      <div class="site-formula">
      <math aria-label="z 下标 n 加 1 等于 z 下标 n 的平方加 c，初始值 z 下标 0 等于 0">
        <msub><mi>z</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub>
        <mo>=</mo>
        <msubsup><mi>z</mi><mi>n</mi><mn>2</mn></msubsup>
        <mo>+</mo><mi>c</mi>
        <mo>,</mo><mspace width="0.6em"></mspace>
        <msub><mi>z</mi><mn>0</mn></msub><mo>=</mo><mn>0</mn>
      </math>
      </div>
    </header>
    <a class="github-link" href="https://github.com/oldj/mandelbrot-set" target="_blank" rel="noopener noreferrer" aria-label="在新窗口打开 GitHub 项目仓库">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.768-.244.768-.542 0-.267-.01-.974-.015-1.912-3.13.68-3.79-1.508-3.79-1.508-.512-1.3-1.25-1.646-1.25-1.646-1.022-.699.077-.685.077-.685 1.13.08 1.725 1.16 1.725 1.16 1.004 1.72 2.633 1.223 3.274.935.102-.727.393-1.223.715-1.504-2.498-.284-5.124-1.249-5.124-5.561 0-1.229.439-2.233 1.16-3.02-.116-.285-.503-1.43.11-2.98 0 0 .945-.302 3.094 1.154A10.79 10.79 0 0 1 12 6.186c.956.004 1.918.13 2.817.378 2.148-1.456 3.091-1.154 3.091-1.154.615 1.55.228 2.695.112 2.98.722.787 1.159 1.791 1.159 3.02 0 4.323-2.63 5.274-5.136 5.553.404.349.764 1.038.764 2.092 0 1.51-.014 2.728-.014 3.098 0 .3.202.65.774.54A11.25 11.25 0 0 0 12 .75Z" /></svg>
    </a>
    <div class="hud-bottom">
    <section id="view-info" class="view-info" aria-label="当前视图信息">
      <dl>
        <div><dt>中心 Re</dt><dd><button id="centre-real" class="coordinate-value" type="button" aria-label="查看完整中心实部" aria-haspopup="dialog" aria-controls="coordinate-dialog" title="点击查看完整中心实部"></button></dd></div>
        <div><dt>中心 Im</dt><dd><button id="centre-imag" class="coordinate-value" type="button" aria-label="查看完整中心虚部" aria-haspopup="dialog" aria-controls="coordinate-dialog" title="点击查看完整中心虚部"></button></dd></div>
        <div><dt>放大倍率</dt><dd id="zoom-level" title="相对于当前窗口的初始视图"></dd></div>
      </dl>
      <button id="copy-view" class="copy-view" type="button" title="复制坐标和放大倍率" aria-label="复制坐标和放大倍率">
        <svg width="14" height="14" class="copy-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" /><path d="M10.5 3.5v-1h-8v8h1" /></svg>
        <svg width="14" height="14" class="copy-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 3.5 3.5L13 5" /></svg>
      </button>
      <span id="copy-feedback" class="copy-feedback" role="status" aria-live="polite" aria-atomic="true"></span>
    </section>
    <div class="hud-actions">
      <span id="boost-feedback" class="boost-feedback" role="status" aria-live="polite" aria-atomic="true"></span>
      <button id="boost-colors" class="hud-button boost-colors" type="button" aria-pressed="false" title="增强色彩（C）：按当前画面加快颜色变化并锁定，缩放时颜色保持一致" hidden>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3M3.4 3.4l2.1 2.1M10.5 10.5l2.1 2.1M3.4 12.6l2.1-2.1M10.5 5.5l2.1-2.1" /></svg>
        增强色彩<span id="boost-level" class="boost-level"></span>
      </button>
      <button id="reset-view" class="hud-button reset-view" type="button" title="恢复初始视图（Home）" hidden>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a5 5 0 1 1-.1 4M3 2.5V6h3.5" /></svg>
        重置
      </button>
    </div>
    </div>
    <dialog id="coordinate-dialog" class="coordinate-dialog" aria-labelledby="coordinate-title" aria-describedby="coordinate-hint">
      <div class="coordinate-dialog-header">
        <h2 id="coordinate-title">完整坐标</h2>
        <button id="close-coordinate" type="button" autofocus>关闭</button>
      </div>
      <p id="coordinate-hint">完整数值，可选择复制。</p>
      <div class="coordinate-dialog-body">
        <p id="coordinate-full" tabindex="0"></p>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
